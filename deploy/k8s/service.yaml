apiVersion: v1
kind: Service
metadata:
  name: profinance
  labels:
    app: profinance
spec:
  # 当前集群的 service-node-port-range 为 80-60000，因此可直接使用 18099。
  # 公网 NAT 转发到节点内网 IP 时，NodePort 能正确暴露；externalIPs 不行。
  type: NodePort
  selector:
    app: profinance
  ports:
    - name: http
      port: 18099
      targetPort: http
      nodePort: 18099
      protocol: TCP
